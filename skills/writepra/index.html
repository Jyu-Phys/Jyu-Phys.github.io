<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>writepra · Skills | Jyu's cosmos</title><link rel="stylesheet" href="/skills/style.css"><style>input,button{font:inherit;border:1px solid #465873;border-radius:7px;padding:10px;background:#192334;color:#e9edf3}button{cursor:pointer;background:#9abcf5;color:#10141d;font-weight:700}form{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#181e2b;border:1px solid #303b4e;border-radius:10px;padding:20px;font:14px/1.8 ui-monospace,monospace}#status{color:#e6b2aa}</style></head>
<body><header><nav aria-label="导航"><a class="brand" href="/">Jyu's cosmos</a><a href="/categories/skills/">Skills</a></nav></header><main><p class="eyebrow"><a href="/categories/skills/">SKILLS</a> / WRITEPRA</p><h1>writepra <span>加密内容</span></h1><p class="lead">输入密码，在浏览器中解锁技能主文件。</p>
<form id="unlock"><input id="pass" type="password" autocomplete="current-password" aria-label="访问密码" placeholder="输入密码" required><button type="submit">解锁</button></form><p id="status" role="status"></p><div id="result" hidden><p>此页面提供技能主文件。配套指南和脚本未包含在此文件中。</p><div class="actions"><button id="download" type="button">下载 SKILL.md</button></div><pre id="content"></pre></div></main><footer>Jyu's cosmos · <a href="/">返回首页</a></footer>
<script>
'use strict';
const $=id=>document.getElementById(id),from64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));let plaintext=null;
$('unlock').addEventListener('submit',async event=>{event.preventDefault();$('status').textContent='正在解锁……';
 try{if(!crypto?.subtle)throw Error('浏览器不支持解密');const response=await fetch('./writepra.encrypted.json',{cache:'no-store'});if(!response.ok)throw Error('密文文件不可用');const data=await response.json();if(data.version!==1||data.algorithm!=='AES-256-GCM'||data.kdf!=='PBKDF2-SHA256'||data.iterations!==600000)throw Error('密文格式不受支持');
 const material=await crypto.subtle.importKey('raw',new TextEncoder().encode($('pass').value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:from64(data.salt),iterations:data.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
 const result=await crypto.subtle.decrypt({name:'AES-GCM',iv:from64(data.iv)},key,from64(data.ciphertext));plaintext=new Uint8Array(result);$('content').textContent=new TextDecoder('utf-8',{fatal:true}).decode(plaintext);$('result').hidden=false;$('pass').value='';$('status').textContent='已在浏览器中解锁。';
 }catch(e){plaintext=null;$('result').hidden=true;$('status').textContent='解锁失败。请检查密码，或稍后重试。'}});
$('download').addEventListener('click',()=>{if(!plaintext)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([plaintext],{type:'text/markdown;charset=utf-8'}));a.download='SKILL.md';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),30000)});
</script></body></html>
