  <style>
    :root {
      color-scheme: light dark;
      --background: #f4f6f8;
      --paper: #ffffff;
      --ink: #202b37;
      --accent: #245c49;
      --line: #d4dee6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #121820;
        --paper: #19222c;
        --ink: #e1e8ef;
        --accent: #a1d8bb;
        --line: #344351;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: clamp(16px, 4vw, 40px);
      background: var(--background);
      color: var(--ink);
      font: 16px/1.7 system-ui, "Microsoft YaHei", sans-serif;
    }
    nav { max-width: 1540px; margin: 0 auto; }
    a { color: var(--accent); text-underline-offset: .2em; }
    main {
      max-width: 34rem;
      margin: clamp(32px, 10vh, 96px) auto 0;
      padding: clamp(20px, 5vw, 38px);
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--paper);
    }
    h1 { margin: 0 0 16px; font-size: clamp(1.25rem, 5vw, 1.65rem); }
    label { display: block; margin-bottom: 6px; font-weight: 650; }
    .field { display: flex; flex-wrap: wrap; gap: 8px; }
    input, button {
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 7px;
      font: inherit;
    }
    input { flex: 1 1 12rem; min-width: 0; background: var(--paper); color: var(--ink); }
    button { background: var(--accent); color: var(--paper); font-weight: 650; cursor: pointer; }
    button:disabled { opacity: .65; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    #unlock-status { margin: 10px 0 0; }
    #unlock-status:empty { display: none; }
  </style>

  <script>
    "use strict";
    const payload = JSON.parse(document.getElementById("encrypted-article").textContent);
    const form = document.getElementById("unlock");
    const field = document.getElementById("password");
    const button = document.getElementById("unlock-button");
    const status = document.getElementById("unlock-status");

    function decodeBase64(value) {
      return Uint8Array.from(atob(value), character => character.charCodeAt(0));
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (button.disabled) return;
      if (!globalThis.crypto?.subtle) {
        status.textContent = "此浏览器无法解锁，请用支持 Web Crypto 的浏览器通过 HTTPS 打开。";
        return;
      }

      const passwordBytes = new TextEncoder().encode(field.value);
      field.value = "";
      button.disabled = true;
      form.setAttribute("aria-busy", "true");
      status.textContent = "正在解锁…";

      try {
        const baseKey = await crypto.subtle.importKey("raw", passwordBytes, "PBKDF2", false, ["deriveKey"]);
        const key = await crypto.subtle.deriveKey({
          name: "PBKDF2",
          salt: decodeBase64(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        }, baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
        const bytes = await crypto.subtle.decrypt({
          name: "AES-GCM",
          iv: decodeBase64(payload.iv),
          tagLength: 128
        }, key, decodeBase64(payload.ciphertext));
        const article = new TextDecoder("utf-8", { fatal: true }).decode(bytes);
        const page = new DOMParser().parseFromString(article, "text/html");
        document.documentElement.replaceWith(document.importNode(page.documentElement, true));
        window.scrollTo(0, 0);
      } catch {
        status.textContent = "密码有误或页面校验失败，请重试。";
        field.focus();
      } finally {
        passwordBytes.fill(0);
        button.disabled = false;
        form.removeAttribute("aria-busy");
      }
    });
  </script>
